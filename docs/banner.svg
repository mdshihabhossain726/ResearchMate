<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ResearchMate banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="170" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="1230" cy="290" r="120" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="60" cy="330" r="110" fill="#ffffff" fill-opacity="0.05"/>

  <!-- paper stack icon -->
  <g transform="translate(86 78)">
    <rect x="26" y="0" width="120" height="156" rx="12" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="13" y="12" width="120" height="156" rx="12" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="0" y="24" width="120" height="156" rx="12" fill="#ffffff"/>
    <rect x="18" y="48" width="84" height="9" rx="4.5" fill="#2563EB"/>
    <rect x="18" y="72" width="84" height="7" rx="3.5" fill="#BFDBFE"/>
    <rect x="18" y="90" width="66" height="7" rx="3.5" fill="#BFDBFE"/>
    <rect x="18" y="108" width="78" height="7" rx="3.5" fill="#BFDBFE"/>
    <rect x="18" y="126" width="50" height="7" rx="3.5" fill="#BFDBFE"/>
    <circle cx="106" cy="150" r="22" fill="#1E3A8A"/>
    <circle cx="103" cy="147" r="9" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="110" y1="154" x2="118" y2="162" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="270" y="152" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">ResearchMate</text>
  <text x="272" y="196" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#BFDBFE">Save, search, analyse and compare your research papers.</text>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E3A8A">
    <rect x="272" y="226" width="96" height="36" rx="18" fill="#ffffff"/><text x="320" y="250" text-anchor="middle">Java 21</text>
    <rect x="380" y="226" width="96" height="36" rx="18" fill="#ffffff"/><text x="428" y="250" text-anchor="middle">Swing</text>
    <rect x="488" y="226" width="138" height="36" rx="18" fill="#ffffff"/><text x="557" y="250" text-anchor="middle">PostgreSQL</text>
    <rect x="638" y="226" width="106" height="36" rx="18" fill="#ffffff"/><text x="691" y="250" text-anchor="middle">PDFBox</text>
    <rect x="756" y="226" width="96" height="36" rx="18" fill="#ffffff"/><text x="804" y="250" text-anchor="middle">Maven</text>
  </g>
</svg>
